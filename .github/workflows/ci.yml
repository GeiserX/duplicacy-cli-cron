name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install bats
        run: |
          rm -rf /tmp/bats
          git clone https://github.com/bats-core/bats-core.git /tmp/bats
          sudo /tmp/bats/install.sh /usr/local
      - run: bats tests/

  timezone:
    # Guards against the tzdata regression: the TZ env var is silently ignored
    # on Alpine unless tzdata is installed, which makes crond fire every job at
    # UTC instead of local time. Only an actual container run catches this.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: duplicacy-cli-cron:ci
          cache-from: type=gha,scope=ci
          cache-to: type=gha,mode=max,scope=ci
      - name: TZ must set the container's local time
        run: |
          set -euo pipefail
          tz=$(docker run --rm -e TZ=Europe/Madrid duplicacy-cli-cron:ci date +%Z)
          echo "TZ=Europe/Madrid -> $tz"
          case "$tz" in
            CET|CEST) echo "ok: tzdata present, TZ honoured" ;;
            *) echo "::error::expected CET/CEST but got '$tz' - is tzdata installed?"; exit 1 ;;
          esac
      - name: Control - unset TZ still yields UTC
        run: |
          set -euo pipefail
          tz=$(docker run --rm duplicacy-cli-cron:ci date +%Z)
          echo "no TZ -> $tz"
          test "$tz" = "UTC" || { echo "::error::expected UTC default, got '$tz'"; exit 1; }
