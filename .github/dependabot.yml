version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # Go 1.27's linker cannot build duplicacy for arm64 (see the Dockerfile header).
      # Proposed twice (#23, #26), merged red twice, both times breaking every arm64
      # release. Remove this together with the Dockerfile pin once a newer Go links arm64.
      - dependency-name: golang
        versions: [">=1.27"]
    commit-message:
      prefix: docker
    labels:
      - docker
      - automated
    groups:
      docker_security:
        applies-to: security-updates
        patterns:
          - '*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    commit-message:
      prefix: ci
    labels:
      - ci
      - automated
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      github-actions-security:
        applies-to: security-updates
        patterns:
          - '*'
